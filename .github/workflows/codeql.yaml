---
name: codeql
"on":
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "19 8 * * 1"
permissions:
  contents: read
jobs:
  analyze:
    # Public repositories can use CodeQL without a paid code-security license.
    if: github.event.repository.private == false
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: cashapp/activate-hermit@e49f5cb4dd64ff0b0b659d1d8df499595451155a # v01.1.2
        with:
          cache: "false"
      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: go
          build-mode: autobuild
          queries: security-and-quality
      # Use the Go extractor directly instead of tracing the Hermit build shim.
      - uses: github/codeql-action/autobuild@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: /language:go
