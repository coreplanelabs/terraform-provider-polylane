---
name: release-please

"on":
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag to resume (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: provider-release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: depot-ubuntu-24.04
    environment: release
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Use an app installed only on this repository, never the org-wide bot.
      # App-authored release PRs trigger their normal CI checks.
      - name: Generate repository-scoped GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Create or update release PR and draft release
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          token: ${{ steps.generate-token.outputs.token }}
          target-branch: main

  goreleaser:
    needs: release-please
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' &&
      (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: depot-ubuntu-24.04
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - name: Checkout protected main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release target
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Expected vMAJOR.MINOR.PATCH" >&2; exit 1; }
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true || {
            echo "Only existing draft releases can be built; published versions must never be replaced" >&2
            exit 1
          }
          git merge-base --is-ancestor "refs/tags/$RELEASE_TAG" origin/main
          git checkout --detach "refs/tags/$RELEASE_TAG"
          python3 - "$RELEASE_TAG" <<'PY'
          import json, sys
          version = json.load(open('.release-please-manifest.json'))['.']
          assert sys.argv[1] == 'v' + version, 'Tag does not match release manifest'
          PY

      - name: Activate Hermit
        uses: cashapp/activate-hermit@e49f5cb4dd64ff0b0b659d1d8df499595451155a # v01.1.2
        with:
          cache: "false"

      - name: Test release source
        run: go test -race ./...

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: Build, sign, and upload to draft
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}

      - name: Verify uploaded artifacts and publish
        shell: bash
        run: |
          set -euo pipefail
          assets=$(mktemp -d)
          gh release download "$RELEASE_TAG" --dir "$assets"
          python3 scripts/verify-release.py "$assets"
          gpg --verify "$assets/terraform-provider-polylane_${RELEASE_TAG#v}_SHA256SUMS.sig" \
            "$assets/terraform-provider-polylane_${RELEASE_TAG#v}_SHA256SUMS"
          gh release edit "$RELEASE_TAG" --draft=false --latest
