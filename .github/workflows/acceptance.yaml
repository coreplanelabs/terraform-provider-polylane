---
name: acceptance

"on":
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * 1-5"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/acceptance.yaml"
      - "Taskfile.yaml"
      - "bin/**"
      - "cmd/**"
      - "go.mod"
      - "go.sum"
      - "internal/**"
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - ".github/workflows/acceptance.yaml"
      - "Taskfile.yaml"
      - "bin/**"
      - "cmd/**"
      - "go.mod"
      - "go.sum"
      - "internal/**"

permissions:
  contents: read

env:
  CI: "true"

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    env:
      # Pull requests always exercise the provider protocol with a harmless
      # smoke key. When repository secrets are configured, the same workflow
      # also runs the read-only UAT imports. Mutating team tests remain opt-in.
      POLYLANE_API_KEY: ${{ secrets.POLYLANE_API_KEY || 'acceptance-smoke-key' }}
      POLYLANE_ENDPOINT: ${{ secrets.POLYLANE_ENDPOINT }}
      POLYLANE_WORKSPACE_ID: ${{ secrets.POLYLANE_WORKSPACE_ID }}
      POLYLANE_TEAM_ACCEPTANCE: ${{ secrets.POLYLANE_TEAM_ACCEPTANCE }}
      POLYLANE_AWS_CONNECTION_REQUEST_ACCEPTANCE: ${{ secrets.POLYLANE_AWS_CONNECTION_REQUEST_ACCEPTANCE }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Activate Hermit
        uses: cashapp/activate-hermit@e49f5cb4dd64ff0b0b659d1d8df499595451155a # v1
        with:
          cache: "true"

      - name: Run acceptance tests
        run: task test:acc
